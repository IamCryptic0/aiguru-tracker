<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Guru — Login</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="loginForm">
    <div class="logo">&#129504;</div>
    <h1>AI Guru Tracker</h1>
    <p>Enter the team password to continue</p>
    <div class="field">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" autofocus>
    </div>
    <button class="btn primary" type="submit" id="loginBtn">Sign in</button>
    <div class="login-err" id="err"></div>
  </form>
</div>
<script src="/assets/login.js"></script>
</body>
</html>
